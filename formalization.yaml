# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Geneson-type bands with a growing 2-adic modulus: finitely many monotone 4-term APs of each 2-adic depth in a permutation of ℤ (Erdős #195, partial)"
  description: >-
    Constructs an explicit bijection f : ℕ ≃ ℤ such that, for every v, only finitely many
    monotone 4-term arithmetic progressions f i, f j, f k, f l (i < j < k < l, increasing or
    decreasing) have a common difference d with 2-adic valuation ν₂(d) = v (Theorem H), and,
    for every t ≥ 1, a bijection f_t : ℕ ≃ ℤ with no monotone 4-term arithmetic progression
    whose difference is not divisible by 2^t (Theorem G). The integers are listed 0 first and
    then in finite bands of magnitudes a^β with base a = 3, cut by residue classes modulo 2^t_s;
    inside a band the negatives come in increasing and the positives in decreasing 2-adic
    order. For constant t_s = t this is the block construction of J. Geneson (arXiv:2608.12604,
    §5) without truncation, and Theorem G is an immediate corollary of the m ∤ d branches of his
    arguments. Theorem H lets the modulus grow with the stage (t_s = s + 1), which gives one
    permutation for all depths at once. Every monotone 4-term progression of these permutations
    has a "seam step" between consecutive stages, and seam progressions do occur, so this is
    partial progress on Erdős Problem #195, which remains open: it asks for the largest k such
    that every permutation of ℤ contains a monotone k-term arithmetic progression (known to be 3
    or 4, so the question is whether every permutation contains a monotone 4-term AP).
  authors:
    - "Alex Lopez"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Alex Lopez"

classification:
  arxiv: ["math.CO", "math.NT"]
  msc2020: ["11B25", "05A05"]

sources:
  - title: "Theorem H (stage-dependent modulus; docs/proof.md in this repository)"
    type: original-proof
    relationship: other
    note: "Theorem H (finitely many monotone 4-term APs of each 2-adic valuation in one permutation of ℤ) is first presented here; found and written with Claude Fable 5.1 and Claude Opus 5.5 (Anthropic)."
  - title: "Density bounds for permutations avoiding monotone arithmetic progressions"
    authors:
      - "Jesse Geneson"
    id: "arXiv:2608.12604"
    type: "preprint"
    relationship: other
    note: "Source of the block construction (§5, (5.2)–(5.3)), its binary inner order (§2) and the separation arguments (Lemmas 2.1 and 5.1–5.5). Theorem G (Erdos195Bands.finite_depth) is an immediate corollary of the m ∤ d branches of his proofs with truncation constant c = 1, stages started one step earlier and 0 listed first; he does not state it. Theorem H replaces his fixed modulus m by a modulus 2^t_s that grows with the stage. The proofs here are written out afresh because his lemmas assume an integer a ≥ 4 and 2 + 1/a < c < a."
  - title: "Erdős Problem #195"
    authors:
      - "Thomas F. Bloom"
    contributors:
      - name: "Paul Erdős"
        role: "problem-proposer"
      - name: "Ronald Graham"
        role: "problem-proposer"
    id: "https://www.erdosproblems.com/195"
    type: "web page"
    relationship: background
  - title: "On permutations avoiding arithmetic progressions"
    authors:
      - "Timothy D. LeSaulnier"
      - "Sujith Vijay"
    id: "doi:10.1016/j.disc.2010.10.006"
    type: "article"
    location: "Discrete Mathematics 311 (2011), 205–207"
    relationship: background
    note: "Proves the odd-difference statement for permutations of ℕ."
  - title: "Avoiding monotone arithmetic progressions in permutations of integers"
    authors:
      - "Sarosh Adenwalla"
    id: "doi:10.1016/j.disc.2024.114183"
    type: "article"
    location: "Discrete Mathematics 347 (2024), 114183"
    relationship: background
    note: "Theorem 4 of arXiv:2211.04451 is the ℕ analogue of Theorem G for every 2^k; Geneson's blocks build on Adenwalla's geometric residue blocks."
  - title: "Chaotic orderings of the rationals and reals"
    authors:
      - "Hayri Ardal"
      - "Tom Brown"
      - "Veselin Jungić"
    id: "doi:10.4169/amer.math.monthly.118.10.921"
    type: "article"
    location: "American Mathematical Monthly 118 (2011), 921–925"
    relationship: background
    note: "The 2-adic order on ℤ used inside the bands (their Definitions 2.1 and 2.2, as recorded in Geneson's §2)."
  - title: "A 4AP-free permutation of the positive integers"
    authors:
