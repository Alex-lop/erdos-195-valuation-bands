  - id: "https://github.com/Alex-lop/erdos-195-difference-not-div-4"
    relationship: other
    note: "Differences not divisible by 4 (the statement of Theorem G for t = 2), by a different construction (a reflection merge). Not used here."
  - id: "https://github.com/google-deepmind/formal-conjectures/blob/5d8b04d3d41b745cc3f2f3cdd5ed04b60c500983/FormalConjectures/ErdosProblems/195.lean"
    relationship: other
    note: "Statement of Erdős #195 (one-sided permutations ℕ ≃ ℤ and HasMonotoneAP). checks/fidelity.lean restates Erdos195Bands.finite_depth with verbatim copies of its List.IsAPOfLengthWith, List.IsAPOfLength and HasMonotoneAP, restricted to differences not divisible by 2^t, and restates Erdos195Bands.main_result with the list form."

status:
  scope: >-
    Fully formalizes Theorem G for every t ≥ 1 and Theorem H in the instance t_s = s + 1, base
    a = 3, in the form "for every v only finitely many monotone 4-term APs, given by first term
    and difference, have ν₂(d) = v". The underlying seam lemma (Erdos195Bands.exists_seam) is
    proved for an arbitrary sequence t : ℕ → ℕ. Not formalized: Theorem H for real bases
    a ≥ 1 + √2 other than 3, the precise seam items (i), (ii) and (iv) (Lean's seam records only
    the divisibility and crude bounds), the factor 2 + 1/a and the explicit bound H(j), and Prop. 2 (seam progressions exist at every seam) beyond the two
    explicit examples proved for the audit. Erdős #195 itself is not resolved: monotone 4-term
    APs occur in all of these permutations.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Fable 5.1", "Claude Opus 5.5 (claude-opus-5-5)"]
      framework: "Claude Code"
      tool_setup: >-
        Claude Code agents in an unattended research run on open Erdős problems: an orchestrating
        workflow; a Claude Opus 5.5 critic agent that read Geneson's §5 with its constants traced
        and noticed Theorem G; a Claude Fable 5.1 solver agent that found Theorem H (stage-dependent
        modulus) and tested it with Python and C; for each of the two theorems three adversarial AI
        referee subagents (proof, computation, scope) that checked the informal argument with
        independently written code; and a Claude Opus 5.5 formalization subagent that wrote the
        Lean proof, iterating with the Lean compiler (omega for the digit and exponent
        arithmetic, linarith for the magnitude bounds).
      cost:
        wall_time: "about 3 hours for the critic, solver, referee and formalization rounds"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        The user asked Claude to find and fully solve an open Erdős problem, formalize it in Lean
        and publish it, falling back to rigorous partial results labelled as partial when no full
        solution survives verification. No full solution was found. The workflow prompts required
        honest labelling, independent verification, credit for prior work, and Lean proofs without
        sorry, native_decide or new axioms.
  spend_usd: "subscription-based"
  notes: >-
    The mathematics, the write-up and the Lean code were produced by Claude Fable 5.1 and Claude
    Opus 5.5 (Anthropic) in Claude Code under the direction of Alex Lopez. Theorem G was noticed
    by a Claude Opus 5.5 critic agent reading Geneson's §5; Theorem H was found by a Claude Fable
    5.1 solver agent. Each informal argument was checked by three adversarial AI referees; the
    formal proof is checked by the Lean kernel. No human has refereed the work.

fidelity:
  divergences: >-
    Theorem H is stated in docs/proof.md for every real base a ≥ 1 + √2 and every sequence t_s with t_s → ∞ (the seam theorem holds for every t_s);
    the Lean statement uses a = 3 and t_s = s + 1 and states only finiteness for each valuation,
    not the explicit bound. A monotone 4-term AP is recorded by the pair (first term in index
    order, difference), so each one is counted once, with a negative difference for a
    decreasing one.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    The statements in Challenge.lean and Solution.lean were checked to elaborate to byte-identical
    terms (pp.all), and #print axioms reports only propext, Classical.choice and Quot.sound for both
    theorems. The informal proofs of Theorems G and H were checked by three adversarial AI referees
    each (proof, computation, scope), with independent programs on windows of integers. The
    informal proofs have not been refereed by a human.

alignment:
  namespace: "Erdos195Bands"
  statements:
    - source: "docs/proof.md, Theorem H and its Corollary (instance t_s = s + 1, a = 3)"
      lean: "Erdos195Bands.main_result"
      module: "Challenge"
      status: "proved"
      note: "One f : ℕ ≃ ℤ; for every v the set of pairs (a, d), d ≠ 0, padicValInt 2 d = v, such that indices i < j < k < l carry a, a + d, a + 2d, a + 3d, is finite."
    - source: "docs/proof.md, Theorem G"
      lean: "Erdos195Bands.finite_depth"
      module: "Challenge"
      status: "proved"
      note: "For every t ≥ 1 some f : ℕ ≃ ℤ has no indices i < j < k < l carrying a, a + d, a + 2d, a + 3d with ¬ 2^t ∣ d; a negative d covers decreasing progressions."

acknowledgements: "Lean 4 and Mathlib; J. Geneson for the block construction this work builds on; the formal-conjectures project for the statement of Erdős #195; the Palomar template for the repository layout."
